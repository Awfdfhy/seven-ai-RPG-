repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: ruff check --fix
        language: system
        types: [python]
        pass_filenames: ["src", "tests"]

      - id: ruff-format
        name: ruff (format)
        entry: ruff format
        language: system
        types: [python]
        pass_filenames: ["src", "tests"]

      - id: mypy
        name: mypy (type check)
        entry: mypy src/ --ignore-missing-imports
        language: system
        pass_filenames: []
        always_run: true
        fail_fast: true

      - id: pytest-unit
        name: pytest (unit tests)
        entry: python run_qa.py --unit --no-cov
        language: system
        pass_filenames: []
        always_run: true

      - id: pytest-data
        name: pytest (data integrity)
        entry: python run_qa.py --data --no-cov
        language: system
        pass_filenames: []
        always_run: true
