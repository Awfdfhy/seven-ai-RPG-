[tox]
envlist = py314, py315, lint, type
isolated_build = True

[testenv]
deps =
    pytest>=9.1
    pytest-cov>=7.1
    coverage>=7.17
commands =
    pytest tests/ -v --tb=short {posargs}

[testenv:lint]
deps =
    ruff
commands =
    ruff check src/ tests/

[testenv:type]
deps =
    mypy
commands =
    mypy src/ --ignore-missing-imports

[testenv:coverage]
deps =
    pytest>=9.1
    pytest-cov>=7.1
    coverage>=7.17
commands =
    pytest tests/ --cov=src --cov-report=term-missing --cov-report=html {posargs}

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -ra
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    data: marks tests as data-integrity checks
